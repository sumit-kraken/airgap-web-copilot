services:
  # AirGap Web Copilot FastAPI backend + WebGPU UI
  copilot:
    build: .
    container_name: airgap-web-copilot
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - ollama

  # Localhost Ollama Daemon
  ollama:
    image: ollama/ollama:latest
    container_name: airgap-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    # GPU acceleration configuration (uncomment if NVIDIA Container Toolkit is installed):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  ollama_models:
